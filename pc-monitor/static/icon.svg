<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#152430"/>
      <stop offset="1" stop-color="#080d13"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="115" fill="none" stroke="#22303d" stroke-width="2"/>

  <!-- 轨道 -->
  <circle cx="256" cy="248" r="132" fill="none" stroke="#1b2836" stroke-width="30"/>
  <!-- 进度弧：约 68% -->
  <circle cx="256" cy="248" r="132" fill="none" stroke="url(#arc)" stroke-width="30"
          stroke-linecap="round" stroke-dasharray="564 830"
          transform="rotate(-90 256 248)" filter="url(#glow)"/>

  <!-- 内部柱状 -->
  <rect x="199" y="268" width="26" height="52" rx="13" fill="#60a5fa"/>
  <rect x="243" y="240" width="26" height="80" rx="13" fill="#a78bfa"/>
  <rect x="287" y="206" width="26" height="114" rx="13" fill="#fbbf24"/>

  <!-- 底部电源点 -->
  <circle cx="256" cy="408" r="9" fill="#2dd4bf"/>
</svg>
